        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;background:#050a1a;overflow-x:hidden;width:100%}
        .root{position:relative;min-height:100vh;background:#050a1a;color:#cbd6e8;font-family:Inter, sans-serif;isolation:isolate;width:100%;overflow-x:hidden}
        .nebula-bg{
          position:fixed;inset:0;z-index:0;
          background:
            radial-gradient(90% 70% at 20% 20%, rgba(90,169,255,0.22) 0%, transparent 60%),
            radial-gradient(80% 60% at 80% 15%, rgba(124,240,255,0.14) 0%, rgba(58,107,255,0.18) 22%, transparent 65%),
            radial-gradient(120% 90% at 50% 120%, rgba(58,107,255,0.18) 0%, transparent 60%),
            radial-gradient(70% 50% at 95% 85%, rgba(165,120,255,0.12) 0%, transparent 60%),
            linear-gradient(180deg, #060d22 0%, #050a1a 45%, #070e26 100%);
        }
        .nebula-bg:after{
          content:'';position:absolute;inset:0;
          background: radial-gradient(140% 100% at 50% 0%, transparent 60%, rgba(0,0,0,0.65) 100%);
          pointer-events:none;
        }
        #stars{position:fixed;inset:0;z-index:1;pointer-events:none}
        .app{
          position:relative;z-index:2;
          display:grid;grid-template-columns:300px 1fr 360px;
          min-height:100vh;gap:0;
          width:100%;max-width:100vw;overflow-x:hidden;
        }
        @media (max-width: 1380px){ .app{grid-template-columns:280px 1fr} .showcase{display:none} }
        @media (max-width: 900px){ .app{grid-template-columns:1fr;min-height:auto} }

        .sidebar-glass{
          position:sticky;top:0;height:100vh;
          background: rgba(12,20,45,0.68);
          backdrop-filter: blur(20px) saturate(140%);
          -webkit-backdrop-filter: blur(20px) saturate(140%);
          border-right:1px solid rgba(120,180,255,0.22);
          box-shadow: 0 0 40px rgba(60,120,255,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
          display:flex;flex-direction:column;padding:22px 16px 16px;
          overflow:hidden;
        }
        @media (max-width: 900px){
          .sidebar-glass{position:fixed;z-index:30;left:0;top:0;width:300px;transform:translateX(-105%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
          .sidebar-glass.open{transform:translateX(0)}
        }
        .logo-block{padding:6px 8px 18px;border-bottom:1px solid rgba(120,180,255,0.12);margin-bottom:14px}
        .logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .mark-cube{
          width:34px;height:34px;border-radius:8px;
          background: linear-gradient(135deg, rgba(90,169,255,0.9), rgba(124,240,255,0.9));
          box-shadow: 0 0 18px rgba(90,169,255,0.6), inset 0 1px 1px rgba(255,255,255,0.7);
          display:grid;place-items:center;
          font-family:Orbitron;color:#05122e;font-weight:800;font-size:16px;
        }

          position:absolute;left:12px;right:12px;bottom:12px;
          padding:8px 10px;border-radius:10px;
          background: rgba(6,12,28,0.82);border:1px solid rgba(120,180,255,0.18);
          display:flex;justify-content:space-between;align-items:center;
          font-family:Space Grotesk;font-size:10px;letter-spacing:0.12em;color:#cbd6e8;text-transform:uppercase;
        }
        .case-label b{color:#7cf0ff}
        .cap-scene{width:200px;height:150px;position:relative}
        .cap-top{
          width:170px;height:92px;margin:0 auto;
          background: linear-gradient(180deg, #1a2d5a 0%, #0e1a36 100%);
          border-radius: 70px 70px 18px 18px / 56px 56px 18px 18px;
          border:1px solid rgba(160,200,255,0.22);
          box-shadow: inset 0 6px 12px rgba(255,255,255,0.12), 0 12px 24px rgba(0,0,0,0.5);
          position:relative;
        }
        .cap-brim{
          width:200px;height:22px;margin:-6px auto 0;
          background: linear-gradient(180deg, #22386a, #0f1f42);
          border-radius: 0 0 40px 40px;
          border:1px solid rgba(160,200,255,0.18);
          box-shadow:0 8px 18px rgba(0,0,0,0.45);
        }
        .goggles{
          position:absolute;left:50%;top:44%;transform:translateX(-50%);
          width:142px;height:34px;display:flex;gap:8px;
        }
        .lens{
          flex:1;border-radius:10px;
          background: linear-gradient(180deg, rgba(124,240,255,0.9), rgba(90,169,255,0.55));
          border:1px solid rgba(255,255,255,0.6);
          box-shadow: 0 0 18px rgba(124,240,255,0.8), inset 0 2px 0 rgba(255,255,255,0.8);
          position:relative;overflow:hidden;
        }
        .lens:after{
          content:'';position:absolute;inset:0;
          background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.6) 50%, transparent 80%);
          animation:glint 2.8s ease-in-out infinite;
        }
        @keyframes glint{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
        .mob-btn{display:none}
        @media (max-width: 900px){
          .mob-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:rgba(12,20,45,0.8);border:1px solid rgba(120,180,255,0.22);color:#cbd6e8}
          .overlay{position:fixed;inset:0;background:rgba(2,6,18,0.6);backdrop-filter:blur(6px);z-index:20;display:none}
          .overlay.show{display:block}
        }

        /* AI Predictive Dialing */
        .ai-hero{padding:22px 22px 16px; margin-bottom:14px}
        .ai-title{font-family:Orbitron;font-size:34px;font-weight:800;letter-spacing:0.02em;color:#e8f2ff;text-transform:uppercase;line-height:0.95}
        @media (max-width:600px){ .ai-title{font-size:26px} }
        .ai-title span{color:#7cf0ff;text-shadow:0 0 16px rgba(124,240,255,0.6)}
        .ai-sub{font-family:Space Grotesk;font-size:14px;line-height:1.5;color:rgba(203,214,232,0.72);margin-top:10px;max-width:720px}
        .ai-grid{display:flex;flex-direction:column;gap:14px}
        .ai-card{padding:20px 18px;position:relative;overflow:hidden}
        .ai-card:after{
          content:'';position:absolute;inset:-1px;border-radius:16px;
          background: radial-gradient(70% 60% at 15% 0%, rgba(90,169,255,0.18), transparent 60%);
          pointer-events:none;
        }
        .ai-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
        .ai-num{
          font-family:Orbitron;font-weight:800;font-size:20px;color:#7cf0ff;
          text-shadow:0 0 12px rgba(124,240,255,0.9), 0 0 22px rgba(90,169,255,0.5);
          letter-spacing:0.06em;
        }
        .ai-card-head h3{
          font-family:Space Grotesk;font-size:15px;font-weight:700;color:#e8f2ff;letter-spacing:0.02em;margin:0;flex:1;min-width:200px
        }
        .ai-pill{
          padding:5px 10px;border-radius:999px;
          background: linear-gradient(180deg, rgba(90,169,255,0.22), rgba(58,107,255,0.22));
          border:1px solid rgba(124,240,255,0.42);
          font-family:Space Grotesk;font-size:10px;letter-spacing:0.14em;color:#7cf0ff;
          box-shadow:0 0 18px rgba(90,169,255,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
          text-transform:uppercase;
        }
        .ai-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media (max-width: 800px){ .ai-split{grid-template-columns:1fr} }
        .ai-gap{
          padding:12px 12px;border-radius:12px;
          font-size:12.5px;line-height:1.6;color:rgba(203,214,232,0.78);
          background: rgba(0,0,0,0.18);
          border:1px solid rgba(120,180,255,0.14);
          position:relative;
        }
        .ai-gap strong{
          font-family:Space Grotesk;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:6px
        }
        .ai-gap.traditional{
          border-left:3px solid rgba(255,90,90,0.72);
          box-shadow: inset 3px 0 18px rgba(255,90,90,0.12), 0 0 16px rgba(255,80,80,0.08);
        }
        .ai-gap.traditional strong{color:#ff8e8e}
        .ai-gap.edge{
          border-left:3px solid rgba(90,169,255,0.9);
          background: linear-gradient(180deg, rgba(18,32,70,0.55), rgba(8,16,36,0.6));
          box-shadow: inset 3px 0 18px rgba(90,169,255,0.18), 0 0 22px rgba(90,169,255,0.12);
        }
        .ai-gap.edge strong{color:#7cf0ff}
        .ai-gap.edge:after{
          content:'';position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;border-radius:12px;
          background: linear-gradient(90deg, transparent, rgba(124,240,255,0.08), transparent);
          pointer-events:none;
        }
